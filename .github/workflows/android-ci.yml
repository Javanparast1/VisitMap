name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-validation:
    name: Validate and build Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # Room exports one schema location. Build only the debug variant here
      # to avoid concurrent debug/release KSP tasks writing the same schema.
      - name: Run debug unit tests, lint, and build debug APK
        run: gradle --no-daemon --no-parallel testDebugUnitTest lintDebug assembleDebug

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Run Room instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon --no-parallel connectedDebugAndroidTest

      - name: Upload debug APK and Room schema
        uses: actions/upload-artifact@v4
        with:
          name: visitmap-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/schemas/*.json
          if-no-files-found: error
          retention-days: 7
